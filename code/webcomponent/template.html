<!doctype html>
<html lang="">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="x-ua-compatible" content="ie=edge" />
        <title>Web Component with template</title>
    </head>
    <body>
        <user-card name="花花"></user-card>
        <template id="userCardTemplate">
            <style>
                :host {
                    display: flex;
                    align-items: center;
                    justify-content: space-around;
                    border: 1px solid #ccc;
                    width: 340px;
                    height: 200px;
                }
                .image {
                    width: 160px;
                    height: 160px;
                }
                .container > .name {
                    font-size: 30px;
                    font-weight: 600;
                }
                .container > .email {
                    font-size: 16px;
                }
            </style>

            <div class="container">
                <p class="name"></p>
                <p class="email">huahua@gmail.com</p>
            </div>
            <img src="./R-C.jpeg" class="image" />
            <button class="focus">关注下</button>
        </template>
        <script type="text/javascript" src="./template.js"></script>
    </body>
</html>
